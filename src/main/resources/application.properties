quarkus.datasource.db-kind=postgresql

# In dev and test mode, Quarkus Dev Services starts a PostgreSQL container automatically.
# For prod, provide the connection via environment variables, e.g.
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/hello
%prod.quarkus.datasource.username=hello
%prod.quarkus.datasource.password=hello

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql
